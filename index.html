<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="base">
        <div class="screen"></div>
        <div class="buttonh">
<div class="line1">
 
        <div class="button one">1</div>
        <div class="button two">2</div>
        <div class="button three">3</div>
        <div class="button " id="plus">+</div>
</div>
<div class="line2">
     
        <div class="button four">4</div>
        <div class="button five">5</div>
        <div class="button six">6</div>
        <div class="button" id="minus">-</div>
</div>
     <div class="line3">
 <div class="button seven">7</div>
        <div class="button eight">8</div>
        <div class="button nine">9</div>
        <div class="button" id="multiply">x</div>
     </div>
     <div class="line4">
  <div class="button" id="remove" >Remove</div>
        <div class="button zero">0</div>
         <div class="button" id="result">=</div>
        <div class="button " id="divide">÷</div>
     </div>
     
 </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
